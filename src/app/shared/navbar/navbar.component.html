      <!-- Left side navigation links (visible only when logged in) -->
      <ul class="navbar-nav me-auto" *ngIf="user">
        <!-- Admin links -->
        <ng-container *ngIf="role === 'Admin'">
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/dashboard" routerLinkActive="active">
              <i class="bi bi-speedometer2"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/books" routerLinkActive="active">

            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/users" routerLinkActive="active">
              <i class="bi bi-people"></i> Manage Users
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/borrow-records" routerLinkActive="active">
              <i class="bi bi-list-check"></i> Borrow Records
            </a>
          </li>
        </ng-container>

        <!-- User links -->
        <ng-container *ngIf="role === 'User'">
          <li class="nav-item">
            <a class="nav-link" routerLink="/user/dashboard" routerLinkActive="active">

            <li><a class="dropdown-item" href="#" (click)="logout()">Logout</a></li>
