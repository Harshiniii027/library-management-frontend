<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <i class="bi bi-journal-bookmark-fill"></i>
      <h2>Welcome Back</h2>
    </div>
    <div class="login-body">
      <form (ngSubmit)="login()" #loginForm="ngForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" [(ngModel)]="credentials.email" name="email" required email #email="ngModel">
          </div>
          <div *ngIf="email.invalid && email.touched" class="text-danger small">
            Valid email required
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" [(ngModel)]="credentials.password" name="password" required #password="ngModel">
          </div>
          <div *ngIf="password.invalid && password.touched" class="text-danger small">
            Password required
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

        <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
          <i class="bi bi-box-arrow-in-right me-2" *ngIf="!isLoading"></i>
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>
      </form>

      <div class="mt-3 text-center">
        Don't have an account? <a routerLink="/register">Sign up</a>
      </div>
    </div>
  </div>
</div>
