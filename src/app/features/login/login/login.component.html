<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <i class="bi bi-book-half"></i>
      <h2>Library Management</h2>
    </div>
    <div class="login-body">
      <div class="role-switch">
        <button class="btn" [class.btn-primary]="role==='User'" [class.btn-outline-primary]="role!=='User'" (click)="role='User'">
          <i class="bi bi-person"></i> User
        </button>
        <button class="btn" [class.btn-primary]="role==='Admin'" [class.btn-outline-primary]="role!=='Admin'" (click)="role='Admin'">
          <i class="bi bi-shield-lock"></i> Admin
        </button>
      </div>

      <form (ngSubmit)="login()" #loginForm="ngForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" [(ngModel)]="credentials.email" name="email" required email #email="ngModel">
          </div>
          <div *ngIf="email.invalid && email.touched" class="text-danger small">
            Valid email required
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" [(ngModel)]="credentials.password" name="password" required #password="ngModel">
          </div>
          <div *ngIf="password.invalid && password.touched" class="text-danger small">
            Password required
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

        <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="loginForm.invalid">
          <i class="bi bi-box-arrow-in-right me-2"></i>Login
        </button>
      </form>
    </div>
  </div>
</div>
