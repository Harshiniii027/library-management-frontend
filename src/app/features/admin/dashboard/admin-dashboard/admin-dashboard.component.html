<div class="container mt-4">
  <h2>Admin Dashboard</h2>
  <div class="row mt-4">
    <div class="col-md-3">
      <div class="card text-white bg-primary mb-3">
        <div class="card-body">
          <h5 class="card-title">Total Users</h5>
          <p class="card-text display-6">{{ summary.total_users }}</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-success mb-3">
        <div class="card-body">
          <h5 class="card-title">Total Books</h5>
          <p class="card-text display-6">{{ summary.total_books }}</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-warning mb-3">
        <div class="card-body">
          <h5 class="card-title">Borrowed Books</h5>
          <p class="card-text display-6">{{ summary.borrowed_books }}</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-info mb-3">
        <div class="card-body">
          <h5 class="card-title">Returned Books</h5>
          <p class="card-text display-6">{{ summary.returned_books }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
