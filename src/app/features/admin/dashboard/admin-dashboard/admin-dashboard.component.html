<div class="dashboard-container">
  <!-- Welcome Card -->
  <div class="welcome-card p-4 mb-4">
    <h2 class="fw-bold">Admin Dashboard</h2>
    <p class="mb-0">Here's your library overview.</p>
  </div>

  <!-- Stats Cards -->
  <div class="row g-4 mb-5">
    <div class="col-md-3">
      <div class="stat-card">
        <div class="stat-icon"> 
          <i class="bi bi-people"></i>
        </div>
        <div class="stat-content">
          <h5>Total Users</h5>
          <p class="display-6 fw-bold">{{ summary.total_users }}</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card">
        <div class="stat-icon">
          <i class="bi bi-book"></i>
        </div>
        <div class="stat-content">
          <h5>Total Books</h5>
          <p class="display-6 fw-bold">{{ summary.total_books }}</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card">
        <div class="stat-icon">
          <i class="bi bi-arrow-right-circle"></i>
        </div>
        <div class="stat-content">
          <h5>Borrowed</h5>
          <p class="display-6 fw-bold">{{ summary.borrowed_books }}</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card">
        <div class="stat-icon">
          <i class="bi bi-arrow-left-circle"></i>
        </div>
        <div class="stat-content">
          <h5>Returned</h5>
          <p class="display-6 fw-bold">{{ summary.returned_books }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="row">
    <div class="col-12">
      <div class="card quick-actions-card">
        <div class="card-header">
          <h5 class="mb-0"><i class="bi bi-lightning-charge me-2"></i>Quick Actions</h5>
        </div>
        <div class="card-body">
          <a routerLink="/admin/books/add" class="btn btn-primary me-2">
            <i class="bi bi-plus-circle me-2"></i>Add Book
          </a>
          <a routerLink="/admin/users" class="btn btn-outline-primary me-2">
            <i class="bi bi-people me-2"></i>Manage Users
          </a>
          <a routerLink="/admin/borrow-records" class="btn btn-outline-primary">
            <i class="bi bi-list-check me-2"></i>View Borrow Records
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
