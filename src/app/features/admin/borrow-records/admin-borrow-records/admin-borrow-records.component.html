<div class="container mt-4">
  <h2>All Borrow Records</h2>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>User</th>
        <th>Book</th>
        <th>Borrow Date</th>
        <th>Return Date</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of records">
        <td>{{ r.borrowId }}</td>
        <td>{{ r.user?.fullName }} ({{ r.user?.email }})</td>
        <td>{{ r.book?.title }} by {{ r.book?.author }}</td>
        <td>{{ r.borrowDate | date:'short' }}</td>
        <td>{{ r.returnDate ? (r.returnDate | date:'short') : '-' }}</td>
        <td>
          <span class="badge" [class.bg-warning]="r.status==='Borrowed'" [class.bg-success]="r.status==='Returned'">
            {{ r.status }}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
