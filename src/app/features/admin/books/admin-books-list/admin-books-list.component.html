<div class="container mt-4">
  <div class="d-flex justify-content-between">
    <h2>Manage Books</h2>
    <a routerLink="/admin/books/add" class="btn btn-success">+ Add New Book</a>
  </div>

  <div *ngIf="loading" class="text-center mt-5">Loading...</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <table class="table table-striped mt-4" *ngIf="!loading && books.length">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Category</th>
        <th>Total Copies</th>
        <th>Available</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let book of books">
        <td>{{ book.bookId }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.category }}</td>
        <td>{{ book.totalCopies }}</td>
        <td>{{ book.availableCopies }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-2" (click)="editBook(book.bookId)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="deleteBook(book.bookId)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  <p *ngIf="!loading && books.length === 0">No books found.</p>
</div>
