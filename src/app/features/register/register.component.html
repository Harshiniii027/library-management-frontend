<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <i class="bi bi-journal-bookmark-fill"></i>
      <h2>Create Account</h2>
    </div>
    <div class="register-body">
      <form (ngSubmit)="register()" #registerForm="ngForm">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" [(ngModel)]="model.fullName" name="fullName" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" [(ngModel)]="model.email" name="email" required email>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" [(ngModel)]="model.password" name="password" required minlength="6">
          </div>
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
        <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
        <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="registerForm.invalid">
          <i class="bi bi-check-circle me-2"></i>Register
        </button>
      </form>
      <div class="mt-3 text-center">
        Already have an account? <a routerLink="/login">Login</a>
      </div>
    </div>
  </div>
</div>
