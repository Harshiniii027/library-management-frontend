<div class="container mt-4">
  <h2>Available Books</h2>
  <div class="row">
    <div class="col-md-4 mb-3" *ngFor="let book of books">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">{{ book.title }}</h5>
          <h6 class="card-subtitle mb-2 text-muted">{{ book.author }}</h6>
          <p class="card-text">Category: {{ book.category }}<br>Available: {{ book.availableCopies }}</p>
          <button class="btn btn-primary" (click)="borrowBook(book.bookId)" [disabled]="book.availableCopies === 0">
            Borrow
          </button>
        </div>
      </div>
    </div>
  </div>
  <p *ngIf="books.length === 0">No books available at the moment.</p>
</div>
